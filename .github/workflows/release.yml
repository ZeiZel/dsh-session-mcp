name: release

# Publish a new version to npm and cut a GitHub release when a version tag is
# pushed.
#
#   npm version patch --no-git-tag-version   # or edit package.json by hand
#   git commit -am "chore(release): 1.2.3"
#   git tag v1.2.3 && git push origin master --tags
#
# Required repository secret:
#   NPM_TOKEN — an npm automation token with publish rights on @nones/dsh-session-mcp.
#               Create one at https://www.npmjs.com/settings/~/tokens (type: Automation).

on:
  push:
    tags:
      - 'v*'

# Never let two releases race for the same npm version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # npm provenance: the publish is signed against this workflow run.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify the tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${pkg}"
            exit 1
          fi

      # npm, not bun: bun's publisher goes through npm's staged publishing, which
      # leaves a 0.0.0-stage placeholder and blocks the real version until it is
      # approved.
      - name: Check npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPM_TOKEN repository secret is not set — add it in Settings → Secrets and variables → Actions"
            exit 1
          fi
          npm whoami

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
